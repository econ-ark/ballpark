name: bbl_consumption_savings

# ─────────────────────────────────────────────────────────────────────
# Benhabib-Bisin-Luo (2019) household consumption-savings stage.
#
# Types (tau, r) are drawn at birth and fixed within life.
# They enter only through calibration overrides (beta, r, w, sigma).
# No within-period shocks ⟹ identity forward mover.
#
# Terminal period: V[>] and dV[>] are replaced by warm-glow bequest
# e(a) = A * a^(1-mu)/(1-mu) via boundary wiring (see terminal block).
# ─────────────────────────────────────────────────────────────────────

symbols:
  spaces:
    Xa: '@def R+'          # raw wealth / end-of-period wealth
    Xm: '@def R+'          # cash-on-hand

  prestate:
    a: '@in Xa'            # arrival: raw wealth (before return + earnings)

  states:
    m: '@in Xm'            # decision: cash-on-hand

  poststates:
    a_next: '@in Xa'       # continuation: end-of-period wealth

  controls:
    c: '@in R+'            # consumption

  # NOTE: No exogenous block. Types (tau, r) are fixed at birth and
  # enter only via calibration parameters. No within-period shocks.

  values:
    V[<]: '@in R'          # arrival-perch value
    V: '@in R'             # decision-perch value
    V[>]: '@in R'          # continuation-perch value
  values_marginal:
    dV[<]: '@in R'         # arrival-perch marginal value
    dV: '@in R'            # decision-perch marginal value
    dV[>]: '@in R'         # continuation-perch marginal value

  parameters:
    beta: '@in (0,1)'      # discount factor (varies by type tau)
    r: '@in R+'            # rate of return on wealth (fixed-at-birth type)
    # unresolved: w is encoded as a scalar parameter, but the paper has an age-varying
    # earnings profile w_t(tau) for tau in {1..10}, t in {1..36} — a 36 x 10 schedule
    # from paper Table 1, interpolated linearly within bracket. Canonical dolo-plus
    # syntax for per-age parameter overrides on a repeated stage was not located in
    # the matsya `topics2026-benhabib-demo` session. Closing this requires either
    # (a) locating a HAFiscal-style canonical example for age-varying calibration,
    # or (b) declaring w as a function of t and tau via an external table reference.
    w: '@in R+'            # earnings (paper: w_t(tau) varies by age and by type)
    sigma: '@in R+'        # CRRA coefficient

equations:
  # ── Arrival → Decision ──────────────────────────────────────────
  # Cash-on-hand = gross return on wealth + earnings
  arvl_to_dcsn_transition: |
    m = (1 + r) * a + w

  # ── Decision → Continuation ─────────────────────────────────────
  # End-of-period wealth = cash-on-hand minus consumption
  dcsn_to_cntn_transition: |
    a_next = m - c

  # ── Backward mover: continuation → decision ────────────────────
  # Standard EGM block. At t = T, V[>] and dV[>] are supplied by
  # the terminal boundary specification (see terminal block below).
  cntn_to_dcsn_mover:
    Bellman: |
      V = max_{c}{c^(1-sigma)/(1-sigma) + beta * V[>]}
    InvEuler: |
      c[>] = (beta * dV[>])^(-1/sigma)
    cntn_to_dcsn_transition: |
      m[>] = a_next + c[>]
    MarginalBellman: |
      dV = c^(-sigma)

  # ── Forward mover: decision → arrival ──────────────────────────
  # Identity mover: no pre-decision shocks, no expectation operator.
  # V[<] and dV[<] pass through from the decision perch.
  dcsn_to_arvl_mover:
    Bellman: |
      V[<] = V
    ShadowBellman: |
      dV[<] = dV

# ═══════════════════════════════════════════════════════════════════
# TERMINAL BOUNDARY SPECIFICATION
# ═══════════════════════════════════════════════════════════════════
# At t = T, the continuation value V[>] is not supplied by a
# successor stage but by the warm-glow bequest function:
#
#   e(a) = A * a^(1-mu) / (1-mu)
#   e'(a) = A * a^(-mu)
#
# This feeds into the EGM backward mover at the terminal period:
#   InvEuler: c[>] = (beta * A * a_next^(-mu))^(-1/sigma)
#
# When mu = sigma, this simplifies; when mu ≠ sigma, EGM still
# works because InvEuler inverts u'(c) = c^(-sigma) regardless
# of the curvature of e(a).
# ═══════════════════════════════════════════════════════════════════

# unresolved: terminal-boundary block — Matsya's Turn 3 recommendation (use the
# interior stage template with terminal boundary wiring V[>] = e(a) and
# dV[>] = e'(a)) is structurally correct, but no canonical dolo-plus syntax for
# `terminal:` blocks was located in the matsya `topics2026-benhabib-demo` session.
# The block below expresses the intent; the keyword `terminal:` and its sub-keys
# may need to be renamed once a canonical idiom is located. The economics
# (warm-glow bequest e(a) = A a^(1-mu)/(1-mu)) is paper-faithful.
terminal:
  parameters:
    A: '@in R+'                                    # bequest weight (paper: A ~ 0.0006)
    mu: '@in R+'                                   # bequest curvature (paper: mu ~ 0.60)
  V[>]: |
    A * a_next^(1-mu) / (1-mu)
  dV[>]: |
    A * a_next^(-mu)

# ═══════════════════════════════════════════════════════════════════
# CALIBRATION-OVERRIDE PARAMETERIZED FAMILY
# ═══════════════════════════════════════════════════════════════════
# BBL (2019) has N_tau x N_r types drawn at birth from an
# intergenerational Markov chain. Within a life, (tau, r) are fixed.
#
# Per Turn 2 analysis: the canonical approach is Option (A) —
# one stage template (above), instantiated once per (tau, r) pair
# with calibration overrides for (beta, r, sigma) and an
# age-varying w schedule.
#
# The intergenerational Markov chain Pi_{tau,tau'} x Pi_{r,r'}
# governing type transmission across generations is a population-
# level object, not a stage-level object.
#
# unresolved: the mechanism for declaring a calibration family in
# dolo-plus has no canonical syntax in the retrieved sources. The
# `calibration_family:` block below expresses the intent; the keyword
# and sub-keys may need to be renamed once a canonical idiom is
# located (likely in HAFiscal). The economics (10 tau × 5 r types
# fixed at birth from paper §I) is paper-faithful.
# ═══════════════════════════════════════════════════════════════════

calibration_family:
  description: |
    BBL type-indexed family. Each (tau, r) pair
    produces one instance of the stage template
    with overridden parameters.
  index: [tau, r_type]
  instances:
    - tau: 1
      r_type: 1
      calibration:
        beta: 0.96
        r: 0.04
        sigma: 1.5
        w: 1.0                                     # unresolved: scalar placeholder; schedule TBD per `parameters:` note
        A: 15.0
        mu: 1.5
    - tau: 2
      r_type: 1
      calibration:
        beta: 0.99
        r: 0.04
        sigma: 2.0
        w: 1.2                                     # unresolved: scalar placeholder; schedule TBD per `parameters:` note
        A: 15.0
        mu: 2.0
    # additional (tau, r_type) pairs follow the same pattern;
    # unresolved: full calibration table (paper §IV / Table 1) not yet inlined.
  population:
    description: |
      Intergenerational Markov chain over types.
      Not part of the individual Bellman problem.
    # unresolved: Pi_tau and Pi_r are 10x10 and 5x5 in the paper baseline (paper
    # §I and footnote 13: r-chain has decay-rate off-diagonals except the last
    # row which uses constant off-diagonals). Placeholders below are 2x2.
    Pi_tau: [[0.8, 0.2], [0.3, 0.7]]
    Pi_r: [[0.9, 0.1], [0.1, 0.9]]
