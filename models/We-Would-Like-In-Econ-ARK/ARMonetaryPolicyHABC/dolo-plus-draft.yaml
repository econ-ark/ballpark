name: AlganRagotDecision

symbols:
  spaces:
    Xq: '@def R+'
    # `Xa: '@def R+'` already encodes the paper's borrowing rule
    # `a' >= 0` (paper eq. (17), p. 8); the parameter `a_min = 0` below
    # is kept for parameter-API consistency.
    Xa: '@def R+'
    Xm: '@def R+'
    Xl: '@def [0,1]'
    # placeholder state space; paper §3.3.2 p. 12 fixes ratios
    #   e_h / e_m = 4.64,  e_m / e_l = 5.65
    # so with the normalization e_m = 1 the paper's `Xe` is
    #   `{1/5.65, 1.0, 4.64} = {0.177, 1.0, 4.64}`
    # Replace at the same touch that substitutes `P_e` numerical entries.
    Xe: '@def {0.5, 1.0, 1.5}'

  prestate:
    q: '@in Xq'
    e: '@in Xe'

  states:
    q: '@in Xq'
    e: '@in Xe'

  poststates:
    a: '@in Xa'
    m: '@in Xm'
    e: '@in Xe'

  controls:
    # note: m_d is the chosen money balance at the decision perch;
    # the savings identity m = m_d carries it into the continuation
    # perch. Symbol table in bellman-excerpt.md documents this.
    # note: per Matsya Evaluate turn (docs/matsya-evaluate-turn.txt,
    # Flag C), illiquid savings a_next is NOT a free control: it is
    # pinned by the budget identity a_next = q + w*e*l + mu - c - m_d
    # inside dcsn_to_cntn_transition below. Three free controls.
    c: '@in R+'
    m_d: '@in R+'
    l: '@in Xl'

  exogenous:
    # P_e: 3x3 row-stochastic matrix on `e in {e_h, e_m, e_l}` (paper
    # §3.3.2, p. 11-12; full numerical calibration documented inline at
    # the `parameters: P_e` block below). Renamed from Pi to avoid
    # collision with inflation Pi_inf on the aggregate side (see
    # bellman-excerpt.md "Out of scope" table).
    e_next: '@dist MarkovChain(P_e)'

  values:
    V[<]: '@in R'
    V: '@in R'
    V[>]: '@in R'

  parameters:
    beta: '@in (0,1)'
    rho: '@in R+'
    rho_m: '@in R+'
    phi_m: '@in R+'
    phi_l: '@in R+'
    gamma: '@in R+'
    w: '@in R+'
    # note: mu is NET of inflation-tax, so the domain is R (not R+);
    # sign for individual households depends on the redistribution
    # rule — verify against the paper before fixing a calibration.
    mu: '@in R'
    R: '@in R+'
    r_m: '@in R+'
    # resolved (paper eq. (17), p. 8): `a_{t+1}^i >= 0`. The paper's
    # borrowing constraint is exactly `a_min = 0`; see verification.md
    # "borrowing constraint" section. The space `Xa: '@def R+'` already
    # encodes the same restriction; this scalar is kept (rather than
    # dropped) so that downstream code that reads a parameter named
    # `a_min` continues to work, but the value is fixed at 0.
    a_min: 0
    # resolved (paper §3.3.2, p. 11-12) — full calibrated 3x3 Markov
    # chain on `e in {e_h, e_m, e_l}`, with structural restrictions and
    # numerical entries:
    #
    #   p_{l,h} = p_{h,l} = 0     (no jumps between extreme states)
    #   p_{l,l} = p_{h,h} = 0.9750
    #   p_{m,m} = 0.9925
    #   row-sum constraint pins p_{h,m} = 1 - p_{h,h} = 0.0250,
    #                          p_{l,m} = 1 - p_{l,l} = 0.0250,
    #                          and p_{m,h} + p_{m,l} = 1 - p_{m,m} = 0.0075
    #   (the split of 0.0075 between p_{m,h} and p_{m,l} pins down
    #    moments — paper p. 12 cites annual autocorrelation 0.91, annual
    #    sd of innovation 0.22, Gini wealth 0.72, share of constrained
    #    households 6%.)
    #
    # Productivity-state ratios (paper p. 12):
    #   e_h / e_m = 4.64,    e_m / e_l = 5.65
    # so e.g. with the normalization e_m = 1, the state space is
    # `Xe: '@def {1/5.65, 1.0, 4.64}' = {0.177, 1.0, 4.64}` (replaces the
    # current placeholder `Xe: '@def {0.5, 1.0, 1.5}'`).
    #
    # Declared here as a plain non-negative parameter per Matsya Evaluate
    # turn (docs/matsya-evaluate-turn.txt, Question 3): `@in
    # StochasticMatrix` has no precedent in the canonical dolo-plus
    # examples. Row-stochastic semantics are carried by the
    # `@dist MarkovChain(P_e)` annotation on the exogenous block above.
    # The numerical 3x3 substitution is left as a follow-up YAML touch
    # (parameter-block matrix literal idiom is a small spec question).
    P_e: '@in R+'

equations:
  # degenerate: identity transition — no within-stage shock between
  # arrival and decision in the household decision stage.
  arvl_to_dcsn_transition: |
    q = q
    e = e

  dcsn_to_cntn_transition: |
    # budget identity pins illiquid savings a (Matsya Flag C);
    # m and e pass through from the decision perch.
    a = q + w * e * l + mu - c - m_d
    m = m_d
    e = e

  cntn_to_dcsn_mover:
    # unresolved: utility kernel.
    #
    # Paper functional form (Algan-Ragot 2009, "Model" / "Households"
    # section; transcribed verbatim from
    # ToramanSY_AlganRagot2009_Summary.ipynb and copied into
    # docs/legacy-drafts/arg2009-bellman-excerpt.md):
    #
    #     u(c, m, l) =
    #         (1/(1-sigma)) * [
    #             ( omega * c^((eta-1)/eta)
    #             + (1-omega) * m^((eta-1)/eta) )^(eta/(eta-1))
    #             * (1-l)^psi
    #         ]^(1-sigma)
    #
    # i.e. CES aggregator over consumption and real money, multiplied
    # by leisure raised to psi, all under CRRA curvature sigma.
    #
    # The Bellman block below uses a separable CRRA + log-money +
    # convex-labor-disutility WORKAROUND (rho on c, rho_m on m_d,
    # gamma on l) because the canonical CES-with-leisure form above is
    # not yet transcribed into modular-DDSL syntax that I am confident
    # is canonical. To resolve, either:
    #   (a) replace the separable kernel below with the CES-leisure
    #       form once a canonical dolo-plus example with a CES inner
    #       aggregator is located (a focused Matsya Evaluate turn on
    #       this would close it), and add eta, omega, sigma, psi to
    #       the parameters block; or
    #   (b) keep the workaround but justify it explicitly in
    #       verification.md by citing the calibration regime in the
    #       paper under which separability and CES coincide
    #       (eta -> 1 limit, etc.) and ground the citation in the
    #       paper's PDF/.mmd once that lands in-repo.
    #
    # Tracked as a paper-grounded follow-up in verification.md and in
    # docs/accept-edit-reject.md (Opus item 2 + the deferred
    # paper-grounded rewrite). See also CONTRIBUTING.md line 44 on
    # the inline `# unresolved:` / `# workaround:` flag idiom.
    Bellman: |
      V = max_{c, m_d, l}{
        c^(1-rho)/(1-rho)
        + phi_m * m_d^(1-rho_m)/(1-rho_m)
        - phi_l * l^(1+gamma)/(1+gamma)
        + beta * V[>]
      }

  dcsn_to_arvl_mover:
    Bellman: |
      V[<] = V

---
name: AlganRagotShock

symbols:
  spaces:
    # paper-grounded resolutions documented at the decision stage's
    # `spaces:` block above (paper §3.3.2 p. 12 ratios for Xe; paper
    # eq. (17) p. 8 for Xa / a_min). Duplicated here only to keep both
    # stages syntactically self-contained.
    Xa: '@def R+'
    Xm: '@def R+'
    Xe: '@def {0.5, 1.0, 1.5}'
    Xq: '@def R+'

  prestate:
    a: '@in Xa'
    m: '@in Xm'
    e: '@in Xe'

  exogenous:
    # resolved: same P_e as decision stage. Numerical calibration documented
    # in the decision stage's `parameters:` block (paper §3.3.2, p. 11-12).
    e_next: '@dist MarkovChain(P_e)'

  states:
    q_next: '@in Xq'
    e_next: '@in Xe'

  poststates:
    q: '@in Xq'
    e: '@in Xe'

  values:
    V[<]: '@in R'
    V: '@in R'
    V[>]: '@in R'

  parameters:
    R: '@in R+'
    r_m: '@in R+'
    # resolved: same Markov transition matrix as decision stage; full
    # calibration documented in the decision stage's `parameters:` block
    # (paper §3.3.2, p. 11-12). Declared plain per Matsya Evaluate turn.
    P_e: '@in R+'

equations:
  arvl_to_dcsn_transition: |
    # paper analogue: paper eq. (16), p. 8 writes the corresponding terms
    # as `(1 + r_t) a_t` and `m_{t-1} / Pi_t`. Mapping:
    #   `R * a`         <-> `(1 + r_t) a_t`        (gross real return on the riskless asset)
    #   `(1 + r_m) * m` <-> `m_{t-1} / Pi_t`       (real return on money; equivalent at any single Pi)
    # The two are identical at any single Pi but our parameterization
    # carries `r_m` as a free parameter rather than deriving it from
    # `Pi`. At a stationary equilibrium with constant `Pi`, this is just
    # a redefinition; in any non-stationary or shock-on-aggregate-money
    # exercise, the consistency `(1 + r_m) = 1 / Pi` would have to be
    # enforced. See verification.md "wealth-on-hand and budget" section
    # for the full mapping; deferred until the aggregate / monetary
    # block enters scope.
    q_next = R * a + (1 + r_m) * m
    e_next = e_next

  # degenerate: identity transition — no further decision between
  # decision and continuation in the shock-realization stage.
  dcsn_to_cntn_transition: |
    q = q_next
    e = e_next

  cntn_to_dcsn_mover:
    Bellman: |
      V = V[>]

  dcsn_to_arvl_mover:
    Bellman: |
      V[<] = E_{e_next}(V)
